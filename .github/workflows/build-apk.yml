
name: Build Worldgen-ai APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Telecharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verifier index.html
        run: |
          if [ ! -f index.html ]; then
            echo "ERREUR : index.html est absent"
            exit 1
          fi

      - name: Creer la configuration
        run: |
          cat > package.json <<'EOF'
          {
            "name": "worldgen-ai",
            "version": "1.0.0",
            "private": true,
            "description": "Worldgen-ai",
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.worldgenai.app",
            "appName": "Worldgen-ai",
            "webDir": "www"
          }
          EOF

          mkdir -p www
          cp index.html www/index.html

      - name: Installer les dependances
        run: npm install

      - name: Initialiser Android
        run: npx cap add android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Worldgen-ai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

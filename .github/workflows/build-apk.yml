name: Build Worldgen-ai APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les fichiers de l'application
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/
          cp sw.js www/
          cp icon.svg www/

      - name: Configurer Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Worldgen-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

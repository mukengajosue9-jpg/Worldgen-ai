name: Build Worldgen-ai APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install and prepare Capacitor
        run: |
          set -e
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p www
          if [ ! -f index.html ]; then
            echo "ERREUR: index.html est introuvable à la racine du dépôt."
            exit 1
          fi
          cp index.html www/index.html
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/manifest.webmanifest; fi
          if [ -f icon.svg ]; then cp icon.svg www/icon.svg; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi

      - name: Ensure Capacitor configuration
        run: |
          set -e
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF_CONFIG'
          {
            "appId": "com.worldgenai.app",
            "appName": "Worldgen-ai",
            "webDir": "www"
          }
          EOF_CONFIG
          fi

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Worldgen-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


name: Build Worldgen-ai Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK tools
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME" || { echo "Android SDK folder not found"; exit 1; }
          if [ -x "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare website for Android
        shell: bash
        run: |
          set -e
          test -f index.html || { echo "ERROR: index.html is missing from the repository root."; exit 1; }
          mkdir -p www
          cp index.html www/index.html
          if [ -d assets ]; then cp -R assets www/; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi
          cat > package.json <<'JSON'
          {
            "name": "worldgen-ai-android",
            "version": "1.0.0",
            "private": true,
            "description": "Worldgen-ai Android wrapper",
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.worldgenai.app",
            "appName": "Worldgen-ai",
            "webDir": "www"
          }
          JSON

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Worldgen-ai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
